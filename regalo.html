                updateNodeSize(node, slider.value);
            });

            if(loading) loading.style.display = 'none';
        });

        // --- UTILIDADES ---
        function updateNodeSize(element, sizePx) {
            element.style.width = `${sizePx}px`;
            element.style.height = `${sizePx}px`;
            element.style.fontSize = `${Math.floor(sizePx * 0.4)}px`;
        }

        slider.addEventListener('input', (e) => {
            // Seleccionamos todos los nodos que empiecen por "node-"
            document.querySelectorAll('div[id^="node-"]').forEach(node => {
                updateNodeSize(node, e.target.value);
            });
        });

        renderNodes();
    </script>
